<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Participantes - IFMT</title>
    <link rel="stylesheet" href="estilo2.css">
</head>

<body>
    <div class="container">
        <h1>Registro de Participantes - IFMT</h1>
        <form
  action="https://formspree.io/f/mjkvvzwb"
  method="POST">
        <form id="participanteForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria" required>
                <option value="1">Ouvinte</option>
                <option value="2">Palestrante</option>
                <option value="3">Organizador</option>
            </select>

            <button type="submit">Enviar</button>
        </form>
        <button id="mostrarLista">Mostrar Lista de Participantes</button>
        <ul id="listaParticipantes"></ul>
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
